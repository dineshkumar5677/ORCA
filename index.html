<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORCA - Live Geospatial Marine Prototype</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            panel: '#eef2f3',      // side panels
            surface: '#f8fafa',    // popups, coordinate box, selected rows
            line: '#c9d3d6',       // dividers
            ink: '#17252d',        // main text
            muted: '#5b6b73',      // secondary text
            marine: '#1d4e6b',     // primary blue
            kelp: '#4b8a3f',       // chlorophyll
            warn: '#d08a12',       // thermal / medium risk
            alarm: '#c8322b',      // critical risk
            restricted: '#9a2a83', // protected area (chart-style magenta)
          },
          fontFamily: {
            sans: ['Barlow', 'system-ui', 'sans-serif'],
            display: ['"Barlow Condensed"', 'Barlow', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Barlow', system-ui, sans-serif; font-variant-numeric: tabular-nums; }

    /* Map */
    .leaflet-container {
      background: #cfe0e6 !important;
      outline: none;
      font-family: 'Barlow', system-ui, sans-serif;
    }
    .leaflet-tile-pane { filter: saturate(0.85); }

    .leaflet-popup-content-wrapper {
      background: #f8fafa !important;
      color: #17252d !important;
      border: 1px solid #c9d3d6;
      border-radius: 4px !important;
      box-shadow: 0 2px 8px rgba(23, 37, 45, 0.25) !important;
    }
    .leaflet-popup-tip { background: #f8fafa !important; }
    .leaflet-popup-content { margin: 10px 12px !important; font-size: 13px; line-height: 1.4; }
    .pop-name { font-size: 15px; font-weight: 600; }
    .pop-id { color: #5b6b73; font-size: 12px; margin-bottom: 6px; }
    .pop-row { display: flex; justify-content: space-between; gap: 16px; }
    .pop-row span:first-child { color: #5b6b73; }
    .pop-status { margin-top: 6px; padding-top: 6px; border-top: 1px solid #c9d3d6; font-weight: 600; }

    .leaflet-tooltip.chart-tip {
      background: #f8fafa;
      color: #17252d;
      border: 1px solid #c9d3d6;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(23, 37, 45, 0.2);
      font-size: 12px;
      padding: 5px 8px;
    }
    .leaflet-tooltip.chart-tip::before { display: none; }
    .leaflet-control-scale-line { color: #17252d; border-color: #17252d; }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #b5c3c8; border-radius: 3px; }
  </style>
</head>
<body class="bg-panel text-ink font-sans overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Coordinates in the Bay of Bengal & Andaman Sea
    const INITIAL_VESSELS = [
      { id: 'AIS-IND-902', name: 'Kalinga Star IV', type: 'Bottom Trawler', speed: '3.1 kn', heading: '184°', lat: 18.25, lon: 87.10, flag: 'IN', status: 'Suspicious Dragging Pattern', risk: 'CRITICAL', sst: '30.8°C', chloro: '4.2 mg/m³', insideMPA: true },
      { id: 'AIS-MM-441', name: 'Irrawaddy Scout', type: 'Longliner', speed: '8.4 kn', heading: '042°', lat: 15.65, lon: 91.20, flag: 'MM', status: 'Standard Transit Corridor', risk: 'LOW', sst: '28.9°C', chloro: '0.4 mg/m³', insideMPA: false },
      { id: 'AIS-DK-019', name: 'Dark Carrier-X', type: 'Unflagged Tender', speed: '1.2 kn', heading: '270°', lat: 19.40, lon: 88.60, flag: 'Unknown', status: 'AIS Blackout & Loitering', risk: 'CRITICAL', sst: '31.2°C', chloro: '3.6 mg/m³', insideMPA: true },
      { id: 'AIS-LK-108', name: 'Dolphin Voyager', type: 'Purse Seiner', speed: '9.2 kn', heading: '310°', lat: 12.50, lon: 83.25, flag: 'LK', status: 'Normal Pelagic Fishing', risk: 'LOW', sst: '29.1°C', chloro: '0.8 mg/m³', insideMPA: false },
      { id: 'AIS-TH-772', name: 'Andaman Pearl 02', type: 'Pelagic Trawler', speed: '4.5 kn', heading: '120°', lat: 11.90, lon: 92.80, flag: 'TH', status: 'Coral Shelf Proximity Warning', risk: 'MEDIUM', sst: '30.9°C', chloro: '1.9 mg/m³', insideMPA: false },
    ];

    // Marine Protected Area (Sundarbans Nursery / Swatch of No Ground boundary)
    const MPA_POLYGON_COORDS = [
      [21.5, 87.5],
      [21.5, 90.0],
      [19.0, 89.8],
      [18.0, 88.0],
      [18.5, 86.8],
      [20.5, 86.9]
    ];

    // Colours used on the map and in the panels
    const RISK_FILL = { CRITICAL: '#c8322b', MEDIUM: '#d08a12', LOW: '#1d4e6b' };
    const RISK_TEXT = { CRITICAL: '#b02a24', MEDIUM: '#8a5c08', LOW: '#1d4e6b' };
    const riskLabel = (r) => r.charAt(0) + r.slice(1).toLowerCase();

    const LAYER_DEFS = [
      { key: 'chloro', label: 'Chlorophyll (Copernicus)', color: '#4b8a3f', desc: 'Sentinel-3 plumes, mg/m³' },
      { key: 'sst',    label: 'Sea surface temperature (NOAA)', color: '#d08a12', desc: 'Coral stress zones' },
      { key: 'ais',    label: 'Vessels (AIS)', color: '#1d4e6b', desc: 'Position, heading and speed' },
      { key: 'mpa',    label: 'Protected area', color: '#9a2a83', desc: 'No-trawl reserve boundary' },
    ];

    const fmtCoord = (value, pos, neg) =>
      `${Math.abs(value).toFixed(3)}°${value >= 0 ? pos : neg}`;

    function App() {
      const [layers, setLayers] = useState({ chloro: true, sst: true, ais: true, mpa: true });
      const [vessels] = useState(INITIAL_VESSELS);
      const [selectedVessel, setSelectedVessel] = useState(INITIAL_VESSELS[0]);
      const [alertSent, setAlertSent] = useState(null); // { id, time }

      const [debateLogs] = useState([
        {
          id: 1,
          sender: 'Copernicus Ecology Agent',
          tone: '#3f7a35',
          time: '11:20:04',
          message: 'Anomalous turbidity plume (4.2 mg/m³) flagged in Sector B-4. High suspended sediment profile indicating physical benthic seabed disruption.'
        },
        {
          id: 2,
          sender: 'Vessel Tracking Agent',
          tone: '#1d4e6b',
          time: '11:20:18',
          message: 'Vessel Kalinga Star IV (AIS-IND-902) detected inside protected Sundarbans Sanctuary Zone. Kinematics: 3.1 kn with continuous zig-zag turns.'
        },
        {
          id: 3,
          sender: 'Risk Synthesis Agent (LLM)',
          tone: '#b02a24',
          time: '11:20:35',
          message: 'Cross-stream verdict (96.4%): unlicensed bottom trawling inside designated breeding habitat. Automated alert forwarded to Indian Coast Guard.'
        }
      ]);

      const mapContainerRef = useRef(null);
      const leafletMapRef = useRef(null);
      const layerGroupRef = useRef({});
      const coordRef = useRef(null);

      // 1. Initialise the Leaflet map
      useEffect(() => {
        if (!mapContainerRef.current || leafletMapRef.current) return;

        const map = L.map(mapContainerRef.current, {
          center: [16.5, 88.0],
          zoom: 6,
          minZoom: 4,
          maxZoom: 11,
          zoomControl: false,
        });

        // CARTO Voyager: free light basemap, no API key
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; OpenStreetMap',
          subdomains: 'abcd',
          maxZoom: 19
        }).addTo(map);

        L.control.zoom({ position: 'topright' }).addTo(map);
        L.control.scale({ position: 'bottomleft', imperial: false, maxWidth: 120 }).addTo(map);

        // Cursor position readout, updated directly in the DOM to avoid re-renders
        map.on('mousemove', (e) => {
          if (coordRef.current) {
            coordRef.current.textContent = `${fmtCoord(e.latlng.lat, 'N', 'S')}   ${fmtCoord(e.latlng.lng, 'E', 'W')}`;
          }
        });

        leafletMapRef.current = map;

        layerGroupRef.current.mpa = L.layerGroup().addTo(map);
        layerGroupRef.current.chloro = L.layerGroup().addTo(map);
        layerGroupRef.current.sst = L.layerGroup().addTo(map);
        layerGroupRef.current.vessels = L.layerGroup().addTo(map);

        return () => {
          map.remove();
          leafletMapRef.current = null;
        };
      }, []);

      // 2. Draw and update the map layers
      useEffect(() => {
        const map = leafletMapRef.current;
        if (!map) return;

        // Protected area
        layerGroupRef.current.mpa.clearLayers();
        if (layers.mpa) {
          L.polygon(MPA_POLYGON_COORDS, {
            color: '#9a2a83',
            fillColor: '#9a2a83',
            fillOpacity: 0.1,
            weight: 2,
            dashArray: '8, 5'
          })
            .bindTooltip('<b>Sundarbans Reserve MPA</b><br/>No commercial trawling', { sticky: true, className: 'chart-tip' })
            .addTo(layerGroupRef.current.mpa);
        }

        // Chlorophyll
        layerGroupRef.current.chloro.clearLayers();
        if (layers.chloro) {
          L.circle([18.2, 87.2], { radius: 75000, color: '#3f7a35', fillColor: '#4b8a3f', fillOpacity: 0.25, weight: 1 })
            .bindTooltip('<b>Chlorophyll spike</b><br/>4.2 mg/m³, high turbidity', { sticky: true, className: 'chart-tip' })
            .addTo(layerGroupRef.current.chloro);

          L.circle([20.4, 89.4], { radius: 60000, color: '#3f7a35', fillColor: '#4b8a3f', fillOpacity: 0.2, weight: 1 })
            .bindTooltip('<b>Estuarine discharge</b><br/>3.1 mg/m³', { sticky: true, className: 'chart-tip' })
            .addTo(layerGroupRef.current.chloro);
        }

        // Sea surface temperature
        layerGroupRef.current.sst.clearLayers();
        if (layers.sst) {
          L.circle([12.0, 92.5], { radius: 95000, color: '#b57407', fillColor: '#d08a12', fillOpacity: 0.22, weight: 1 })
            .bindTooltip('<b>Thermal stress hotspot</b><br/>+2.1°C above baseline', { sticky: true, className: 'chart-tip' })
            .addTo(layerGroupRef.current.sst);
        }

        // Vessels: an arrow that points along the vessel's heading
        layerGroupRef.current.vessels.clearLayers();
        if (layers.ais) {
          vessels.forEach((vessel) => {
            const isSelected = selectedVessel && selectedVessel.id === vessel.id;
            const size = isSelected ? 34 : 26;
            const hdg = parseInt(vessel.heading, 10) || 0;
            const fill = RISK_FILL[vessel.risk];

            const html = `
              <div style="box-sizing:border-box;width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;${isSelected ? 'border:2px solid #17252d;background:rgba(255,255,255,0.55);' : ''}">
                <svg width="20" height="20" viewBox="0 0 20 20" style="transform:rotate(${hdg}deg);filter:drop-shadow(0 1px 1.5px rgba(0,0,0,0.5))">
                  <path d="M10 1.5 L16 17 L10 13.5 L4 17 Z" fill="${fill}" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round"/>
                </svg>
              </div>`;

            const icon = L.divIcon({
              className: '',
              html,
              iconSize: [size, size],
              iconAnchor: [size / 2, size / 2]
            });

            L.marker([vessel.lat, vessel.lon], { icon })
              .on('click', () => {
                setSelectedVessel(vessel);
                map.panTo([vessel.lat, vessel.lon], { animate: true, duration: 0.8 });
              })
              .bindPopup(`
                <div>
                  <div class="pop-name">${vessel.name}</div>
                  <div class="pop-id">${vessel.id}, flag ${vessel.flag}</div>
                  <div class="pop-row"><span>Type</span><span>${vessel.type}</span></div>
                  <div class="pop-row"><span>Speed</span><span>${vessel.speed}</span></div>
                  <div class="pop-row"><span>Heading</span><span>${vessel.heading}</span></div>
                  <div class="pop-row"><span>Water temp</span><span>${vessel.sst}</span></div>
                  <div class="pop-row"><span>Chlorophyll</span><span>${vessel.chloro}</span></div>
                  <div class="pop-status" style="color:${RISK_TEXT[vessel.risk]}">${riskLabel(vessel.risk)} risk: ${vessel.status}</div>
                </div>
              `)
              .addTo(layerGroupRef.current.vessels);
          });
        }
      }, [layers, vessels, selectedVessel]);

      const focusOnVessel = (vessel) => {
        setSelectedVessel(vessel);
        if (leafletMapRef.current) {
          leafletMapRef.current.setView([vessel.lat, vessel.lon], 8, { animate: true });
        }
      };

      const toggleLayer = (key) => setLayers((prev) => ({ ...prev, [key]: !prev[key] }));

      const sendAlert = () => {
        const time = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: false });
        setAlertSent({ id: selectedVessel.id, time });
      };
      const sentForSelected = alertSent && alertSent.id === selectedVessel.id;

      return (
        <div className="h-screen w-screen flex flex-col bg-panel">

          {/* Top bar */}
          <header className="h-14 shrink-0 bg-surface border-b border-line px-5 flex items-center justify-between">
            <div className="flex items-baseline gap-4">
              <span className="font-display text-3xl font-bold text-marine leading-none">ORCA</span>
              <span className="text-sm text-muted">Team Spark, SIH26176</span>
            </div>

            <div className="text-sm text-muted hidden md:block">
              Bay of Bengal and Andaman Sea
            </div>

            <button
              onClick={() => {
                if (leafletMapRef.current) leafletMapRef.current.setView([16.5, 88.0], 6);
              }}
              className="px-3 py-1.5 text-sm font-medium text-marine bg-white border border-marine/40 rounded hover:bg-marine hover:text-white transition-colors"
            >
              Reset view
            </button>
          </header>

          {/* Main body */}
          <div className="flex-1 flex overflow-hidden">

            {/* Left panel */}
            <aside className="w-72 shrink-0 bg-panel border-r border-line flex flex-col overflow-y-auto custom-scrollbar">

              <section className="p-4 border-b border-line">
                <div className="text-sm text-muted">Ecosystem health</div>
                <div className="flex items-baseline gap-2 mt-1">
                  <span className="font-display text-5xl font-semibold text-ink leading-none">68.4</span>
                  <span className="text-sm text-muted">out of 100</span>
                </div>
                <div className="h-1.5 bg-[#d3dde0] rounded-sm mt-3">
                  <div className="h-full bg-marine rounded-sm" style={{ width: '68.4%' }}></div>
                </div>
              </section>

              <section className="px-4 pt-3 pb-2 border-b border-line">
                <h2 className="text-sm font-semibold text-ink mb-1">Map layers</h2>
                {LAYER_DEFS.map((item) => (
                  <label key={item.key} className="flex items-start gap-3 py-2.5 border-t border-line/70 first:border-t-0 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={layers[item.key]}
                      onChange={() => toggleLayer(item.key)}
                      className="mt-1 h-4 w-4 accent-[#1d4e6b]"
                    />
                    <span className="flex-1">
                      <span className="flex items-center gap-2 text-sm font-medium text-ink">
                        <span className="inline-block w-2.5 h-2.5 rounded-sm" style={{ background: item.color }}></span>
                        {item.label}
                      </span>
                      <span className="block text-xs text-muted mt-0.5 ml-[18px]">{item.desc}</span>
                    </span>
                  </label>
                ))}
              </section>

              <section className="pt-3 flex-1">
                <h2 className="text-sm font-semibold text-ink px-4 mb-1">Vessels in range</h2>
                <ul>
                  {vessels.map((v) => (
                    <li key={v.id} className="border-t border-line/70">
                      <button
                        onClick={() => focusOnVessel(v)}
                        className={`w-full text-left flex items-center justify-between gap-3 pl-3 pr-4 py-2 border-l-4 transition-colors ${
                          selectedVessel.id === v.id ? 'bg-white' : 'hover:bg-surface'
                        }`}
                        style={{ borderLeftColor: RISK_FILL[v.risk] }}
                      >
                        <span>
                          <span className="block text-sm font-medium text-ink">{v.name}</span>
                          <span className="block text-xs text-muted">{v.type}</span>
                        </span>
                        <span className="text-right">
                          <span className="block text-sm text-ink">{v.speed}</span>
                          <span className="block text-xs font-medium" style={{ color: RISK_TEXT[v.risk] }}>{riskLabel(v.risk)}</span>
                        </span>
                      </button>
                    </li>
                  ))}
                </ul>
              </section>

              <div className="text-xs text-muted p-4 border-t border-line">
                Sant Longowal Institute of Engineering and Technology
              </div>
            </aside>

            {/* Map */}
            <main className="flex-1 relative">
              <div ref={mapContainerRef} className="w-full h-full"></div>
              <div
                ref={coordRef}
                className="absolute left-3 top-3 z-[1000] bg-surface/95 border border-line rounded px-2.5 py-1 text-xs text-ink pointer-events-none"
              >
                Move the cursor over the map
              </div>
            </main>

            {/* Right panel */}
            <aside className="w-96 shrink-0 bg-panel border-l border-line flex flex-col">
              <div className="px-4 py-3 border-b border-line flex items-baseline justify-between">
                <h2 className="text-sm font-semibold text-ink">Agent log</h2>
                <span className="text-xs text-muted">LLaMA 2 with LangChain</span>
              </div>

              <div className="flex-1 overflow-y-auto custom-scrollbar">
                {debateLogs.map((log) => (
                  <div key={log.id} className="px-4 py-3 border-b border-line/70 border-l-4" style={{ borderLeftColor: log.tone }}>
                    <div className="flex items-baseline justify-between mb-1">
                      <span className="text-sm font-semibold" style={{ color: log.tone }}>{log.sender}</span>
                      <span className="text-xs text-muted">{log.time}</span>
                    </div>
                    <p className="text-sm text-ink leading-relaxed">{log.message}</p>
                  </div>
                ))}
              </div>

              <div className="p-4 bg-surface border-t border-line">
                <div className="flex items-baseline justify-between">
                  <h3 className="text-sm font-semibold text-ink">Recommended action</h3>
                  <span className="text-xs text-muted">96.4% confidence</span>
                </div>
                <p className="text-sm text-ink mt-1.5 leading-relaxed">
                  Target vessel is dredging within 1.8 km of sensitive nurseries. Coordinates verified.
                </p>
                <button
                  onClick={sendAlert}
                  disabled={sentForSelected}
                  className={`mt-3 w-full text-sm font-semibold py-2 px-3 rounded text-white transition-colors ${
                    sentForSelected ? 'bg-muted cursor-default' : 'bg-alarm hover:bg-[#a92721]'
                  }`}
                >
                  {sentForSelected ? 'Alert sent' : 'Send alert to Coast Guard'}
                </button>
                {sentForSelected && (
                  <p className="text-xs text-muted mt-2">
                    {selectedVessel.name} at {fmtCoord(selectedVessel.lat, 'N', 'S')}, {fmtCoord(selectedVessel.lon, 'E', 'W')} reported at {alertSent.time}.
                  </p>
                )}
              </div>
            </aside>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
